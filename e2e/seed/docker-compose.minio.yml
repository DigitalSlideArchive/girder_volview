# MinIO stands in for S3 so we can exercise Girder's assetstore *import* path
# rather than plain upload.
#
# script/deploy starts it with the rest of the stack: it is in .env.example's
# DSA_COMPOSE_FILES. To start it on its own, bring it up into the EXISTING
# compose project so it lands on the same network as girder -- otherwise girder
# cannot resolve the `minio` hostname:
#
#     docker compose -p dsa-plus -f docker-compose.minio.yml up -d
#
# Girder reaches it at http://minio:9000 (service name on the compose network).
# From the host: API on :9000, web console on :9001.

services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # A named volume belongs to the compose project, not to whichever checkout
      # or command started MinIO, so every worktree sees the one seeded bucket
      # girder's imported file records point into. A bind mount path would
      # resolve differently per entry point, and an empty bucket serves
      # NoSuchBucket XML with a 200, which VolView reports as "Not DICOM".
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  minio-data:
